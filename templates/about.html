{% extends 'master.html' %}
{% load static %}
{%block title %} about {%endblock%}
{%block content%}

<div class="container">
    <div class="row">
        <div class="col-8">
            <table>
                <tr class="table">
                    <th>name</th>
                    <th>english</th>
                    <th>math</th>
                    <th>chemistry</th>
                    <th>biology</th>
                    <th>total</th>
                </tr>
                {%for score in scores%}
                <tr>
                    <td>{{score.names}}</td>
                    <td>{{score.english}}</td>
                    <td>{{score.maths}}</td>
                    <td>{{score.chemistry}}</td>
                    <td>{{score.biology}}</td>
                </tr>
                {%endfor%}
            </table>
        </div>
    </div>
</div>

{%endblock%}
